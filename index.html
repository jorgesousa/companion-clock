<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, user-scalable=no">
<title>Home</title>
<link href="a/fonts.css" rel="stylesheet">
<script src="a/hls.min.js" defer></script>
<style>
:root{
  --bg:#0e0e0c;--bg2:#161614;--fg:#f2efe8;--muted:#8f8b80;--line:#2a2925;
  --accent:#e8473a;--accent-ink:#0e0e0c;--ok:#5ee07a;
  --sans:"Inter Tight",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  /* type scale: caption 18 · ui 22 · row 26 · number 40 · value 46 · clock 210 */
  --t-cap:18px;--t-ui:22px;--t-row:26px;--t-num:40px;--t-val:46px;--t-big:210px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--fg);font-family:var(--sans);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
::selection{background:var(--accent);color:var(--accent-ink)}
::-webkit-scrollbar{width:0;height:0;display:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-transform:inherit;letter-spacing:inherit}
.dim{color:var(--muted)}
button:focus,input:focus{outline:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

.mono{font:500 var(--t-cap)/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}
.acc{color:var(--accent)}
.num{font-family:var(--sans);font-weight:800;letter-spacing:-.04em;line-height:1}
.solid{color:var(--fg)}
.outline{position:relative;color:var(--bg);-webkit-text-stroke:3px var(--fg)}
.outline:after{content:attr(data-t);position:absolute;left:0;top:0;color:var(--bg);-webkit-text-stroke:0;pointer-events:none}

/* header */
header{position:absolute;top:0;left:0;right:0;height:68px;display:flex;align-items:baseline;padding:4px 24px 0 36px;z-index:10}
#net{width:160px;color:var(--fg);text-align:left;height:64px}
#net i{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--muted);margin-right:8px;vertical-align:1px}
#net.on i{background:var(--ok)}
nav{flex:1;display:flex;align-items:baseline;justify-content:center;height:64px}
nav button{height:64px;padding:0 14px;color:var(--muted);position:relative;font-size:var(--t-ui)}
nav button.on{color:var(--fg)}
nav{position:relative}
#nav-bar{position:absolute;left:0;bottom:10px;height:3px;width:10px;background:var(--accent);transition:transform .35s var(--ease),width .35s var(--ease);-webkit-transform-origin:0 0;transform-origin:0 0}
#hdr-right{width:160px;text-align:right}
#hdr-right button{height:64px;padding:0 12px;color:var(--muted)}

/* views */
.view{position:absolute;top:68px;left:0;right:0;bottom:0;padding:0 36px 34px;display:flex}
.col-l{width:360px;flex-shrink:0;display:flex;flex-direction:column;justify-content:flex-end}
.col-r{flex:1;margin-left:28px;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.big{font-size:var(--t-big);line-height:.8;letter-spacing:-.05em}
.big + .big{margin-top:10px}
.mrow{display:flex;align-items:flex-end;margin-top:10px}
#h-s{font-size:var(--t-val);color:var(--muted);margin:0 0 4px 14px;letter-spacing:-.03em}
.roller{position:relative;overflow:hidden;padding:.08em .08em .08em 0;margin:-.08em -.08em -.08em 0;flex-shrink:0}
.roller .r{display:block;will-change:transform}
.roller .r.in{position:absolute;left:0;top:.08em}
.tfill{position:relative;overflow:hidden}
#t-s{display:block}
#t-m{transition:color .4s var(--ease)}
#t-m.hot{color:var(--accent)}
#h-timer{color:var(--fg);display:none}
#h-timer.on{display:inline}
#h-timer.hot{color:var(--accent)}
#h-timer svg.i,#h-alarm svg.i{margin-right:6px;vertical-align:-3px}
#h-timer+#h-alarm{display:none}
.view.enter{animation:vin .22s var(--ease)}
@keyframes vin{from{opacity:0;-webkit-transform:translateY(6px);transform:translateY(6px)}to{opacity:1;-webkit-transform:none;transform:none}}
.blk{transition:background-color .4s var(--ease),color .4s var(--ease),padding .4s var(--ease),margin .4s var(--ease)}
.blk.hot{background:var(--accent);color:var(--accent-ink);padding:16px 18px;margin:10px -18px 0;border-radius:4px;border-bottom-color:transparent}
.blk.hot .l,.blk.hot .acc{color:var(--accent-ink)}
/* meeting in progress: accent time, a live dot, and the block's rule fills as the meeting elapses */
#h-next-blk{position:relative}
#h-live{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent);-webkit-transform-origin:0 50%;transform-origin:0 50%;-webkit-transform:scaleX(0);transform:scaleX(0);opacity:0;transition:transform 1s linear,opacity .4s var(--ease)}
.blk.live #h-live{opacity:1}
.blk.live .v{color:var(--accent)}
.blk.live .v small{color:var(--fg)}
.live-dot{display:inline-block;position:relative;width:14px;height:14px;border-radius:7px;background:var(--accent);margin-right:12px;vertical-align:-1px}
.live-dot:after{content:"";position:absolute;left:0;top:0;width:14px;height:14px;border-radius:7px;background:var(--accent);animation:ping 2s cubic-bezier(.16,1,.3,1) infinite}
@keyframes ping{from{-webkit-transform:scale(1);transform:scale(1);opacity:.7}to{-webkit-transform:scale(3.2);transform:scale(3.2);opacity:0}}
#h-next-c{transition:transform .22s cubic-bezier(.16,1,.3,1),opacity .22s cubic-bezier(.16,1,.3,1)}
#h-next-c.outl{transition-duration:.16s;transform:translateX(-36px);opacity:0}
#h-next-c.outr{transition-duration:.16s;transform:translateX(36px);opacity:0}
#h-next-c.inl{transform:translateX(-36px);opacity:0}
#h-next-c.inr{transform:translateX(36px);opacity:0}
.blk.nudge-l #h-next-c{animation:nudgeL .3s cubic-bezier(.16,1,.3,1)}
.blk.nudge-r #h-next-c{animation:nudgeR .3s cubic-bezier(.16,1,.3,1)}
@keyframes nudgeL{40%{transform:translateX(-10px)}}
@keyframes nudgeR{40%{transform:translateX(10px)}}
#h-next .mq{display:inline-block;white-space:nowrap}
#h-next small.mq-on{text-overflow:clip;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%)}
#h-next-l .pos{float:right;color:var(--muted)}
.blk.hot #h-next-l .pos{color:var(--accent-ink)}
.cl{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:12px;vertical-align:2px;flex-shrink:0}
.cl.none{box-shadow:inset 0 0 0 1.5px var(--muted)}
@media (prefers-reduced-motion:reduce){.view.enter{animation:none}.roller .r{transition:none!important}#nav-bar{transition:none}#amb{transition:none}.live-dot:after{animation:none}#alert.ringing:before,#alert.ringing .al-wave,#alert.ringing .al-digits,#alert.ringing .al-tap{animation:none}#cal-skel i,.blk .v.loading{animation:none}#h-next-c{transition:opacity .16s}#h-next-c.outl,#h-next-c.outr,#h-next-c.inl,#h-next-c.inr{transform:none}.blk.nudge-l #h-next-c,.blk.nudge-r #h-next-c{animation:none}#h-live{transition:opacity .4s}}

.cap{padding-bottom:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.cap-side{white-space:nowrap;flex-shrink:0;margin-left:16px}
#h-muted{color:var(--accent);margin-left:12px}
#h-date{font-size:var(--t-ui);letter-spacing:.04em;color:var(--fg);white-space:nowrap}
#h-alarm svg.i{margin-right:6px;vertical-align:-3px}
.blk{padding:18px 0;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0;padding-bottom:0}
.blk .v{font-size:var(--t-val)}
.blk .v small{display:block;font:600 var(--t-ui)/1.2 var(--sans);letter-spacing:-.01em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .l{margin-top:9px}
.blk .v .of{font:600 var(--t-ui)/1 var(--sans);color:var(--muted);letter-spacing:-.01em;margin-left:8px}
#h-steps-l{letter-spacing:.02em;white-space:nowrap}

/* agenda */
#v-cal{flex-direction:column;padding-bottom:0}
#cal-empty{margin-top:auto;padding-bottom:34px}
/* loading: skeleton rows in the real layout, pulsing one after another */
#cal-skel{flex:1}
#cal-skel i{display:block;height:16px;border-radius:3px;background:var(--line);animation:skel 1.4s ease-in-out infinite}
#cal-skel .sk-h{padding:4px 0 14px;border-bottom:1px solid var(--line)}
#cal-skel .sk-h i{height:12px}
#cal-skel .sk-r{display:flex;align-items:center;height:62px;border-bottom:1px solid var(--line)}
#cal-skel .sk-t{width:150px;margin-right:50px;flex-shrink:0}
#cal-skel .sk-r:nth-child(3) i{animation-delay:.12s}#cal-skel .sk-r:nth-child(4) i{animation-delay:.24s}
#cal-skel .sk-r:nth-child(5) i{animation-delay:.36s}#cal-skel .sk-r:nth-child(6) i{animation-delay:.48s}
@keyframes skel{0%,100%{opacity:.45}50%{opacity:1}}
/* Home: "Loading" breathes */
.blk .v.loading{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}
.ev-group{margin-top:18px}
.ev-group:first-child{margin-top:0}
.ev-group>.mono{padding:8px 0 10px;border-bottom:1px solid var(--line);position:-webkit-sticky;position:sticky;top:0;z-index:2;background:var(--bg)}
.ev-group>.mono .today{color:var(--fg)}
/* day heading: the day in big type, date and location small beside it, a white rule closing it */
.ev-group>.dh{display:flex;align-items:baseline;padding:10px 0 12px;border-bottom:2px solid var(--fg);position:-webkit-sticky;position:sticky;top:0;z-index:2;background:var(--bg)}
.dh .dbig{font:800 34px/1 var(--sans);letter-spacing:-.035em}
.dh .dsm{flex:1;margin-left:14px;font:500 var(--t-cap)/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.dh .sum{color:var(--muted);white-space:nowrap}
.ev{display:flex;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--line)}
.ev .t{width:200px;flex-shrink:0;font-size:var(--t-ui);letter-spacing:.02em}
.ev .n{font:600 var(--t-row)/1.15 var(--sans);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.now .t{color:var(--accent)}
.ev.past .t,.ev.past .n{opacity:.45}
.ev .n{display:flex;align-items:baseline;flex:1;min-width:0}
.ev .n .cl{position:relative;top:-2px}
.ev .mqw{flex:1;min-width:0;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%)}
.ev .mqw.mq-on{text-overflow:clip;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%)}
.ev .mqw.mq-on .mq{display:inline-block}
.ev-group>.mono .sum{float:right}
.wk-rule{display:flex;align-items:center;margin:30px 0 -2px}
.wk-rule:before{content:"";flex:1;height:2px;background:var(--accent);margin-right:14px}
.wk-rule:after{content:"";width:36px;height:2px;background:var(--accent);margin-left:14px}
.wk-rule b{font-weight:500;color:var(--accent);letter-spacing:.08em;white-space:nowrap}
.wl svg.i{width:18px;height:18px;margin-right:6px;vertical-align:-3px}
.wl.office{color:var(--accent)}
.ev.free{background-image:repeating-linear-gradient(135deg,rgba(94,224,122,.18) 0,rgba(94,224,122,.18) 1.5px,transparent 1.5px,transparent 9px)}
.ev.free .t{color:var(--muted)}
.ev.free .n{font:600 var(--t-row)/1.15 var(--sans);color:var(--ok);letter-spacing:-.015em}
.ev.free .cl{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ok)}
.ev.free .n{display:flex;align-items:center}
.ev.free em{font-style:normal;white-space:nowrap}
.ev.free.live{position:relative;background-color:rgba(94,224,122,.09);background-image:repeating-linear-gradient(135deg,rgba(94,224,122,.32) 0,rgba(94,224,122,.32) 1.5px,transparent 1.5px,transparent 9px)}
.ev.free.live .t{color:var(--ok)}
.ev.free.live em{font:600 var(--t-row)/1.15 var(--sans);letter-spacing:-.015em}
.ev.free.live .left{margin-left:12px;color:var(--ok)}
#cal-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:22px}
.empty-title{font-size:84px;line-height:.9;letter-spacing:-.045em}
.empty-text{margin-top:22px;max-width:620px;color:var(--muted);font:500 var(--t-ui)/1.4 var(--sans);letter-spacing:-.005em}

/* timer */
.seg{display:flex;border-bottom:1px solid var(--line);margin-bottom:auto}
.seg button{height:56px;margin-right:28px;color:var(--muted);position:relative;font-size:var(--t-ui)}
.seg button.on{color:var(--fg)}
.seg button.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent)}
.presets{display:flex;flex-wrap:wrap;margin:0 -4px}
.presets button{width:calc(33.333% - 8px);margin:0 4px 8px;height:76px;border:1px solid var(--line);border-radius:4px;text-align:center;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.presets button .num{font-size:var(--t-num)}
.presets button .mono{margin-top:4px;color:var(--muted);line-height:1}
.presets button.on{border-color:var(--fg)}
.presets button:active{background:var(--bg2)}
.actions{display:flex;margin-top:6px}
.btn{height:68px;border-radius:4px;padding:0 24px;font:600 var(--t-ui)/1 var(--sans);letter-spacing:-.01em;display:flex;align-items:center;justify-content:center}
.btn svg.i{width:22px;height:22px;margin-right:10px}
.btn.pri{flex:1;background:var(--fg);color:var(--bg)}
.btn.pri svg.i{stroke:var(--bg)}
.btn.sec{border:1px solid var(--line);margin-left:8px}
.btn:active{opacity:.8}
#t-bar{height:2px;background:var(--line);margin-top:22px;position:relative}
#t-bar s{position:absolute;left:0;top:0;bottom:0;background:var(--fg);transition:width 1s linear}
#t-bar.low s{background:var(--accent)}

.add{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.stp{display:flex;flex-direction:column;align-items:center;width:96px}
.stp button{width:96px;height:52px;border:1px solid var(--line);border-radius:4px;color:var(--fg)}
.stp button:active,.stp button.held{background:var(--bg2);border-color:var(--muted)}
.stp svg.i{width:30px;height:30px;stroke-width:2}
.stp .num{margin:6px 0}
.stp .num,.add .colon{font-size:var(--t-val)}
.add .colon{margin:0 6px;padding-bottom:4px}
.add .btn{margin-left:auto;height:68px;padding:0 22px}
#alrm-list{overflow-y:auto;max-height:180px}
.alrm{display:flex;align-items:center;height:72px;border-bottom:1px solid var(--line)}
.alrm .num{font-size:var(--t-num);flex:1}
.alrm.off .num{color:var(--muted)}
.sw{width:60px;height:34px;border-radius:17px;background:var(--line);position:relative;transition:background .2s var(--ease)}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:14px;background:var(--muted);transition:transform .2s var(--ease),background .2s}
.sw.on{background:var(--fg)}
.sw.on:after{transform:translateX(26px);background:var(--bg)}
.del{width:56px;height:56px;color:var(--muted);margin-left:6px}

/* tv */
#v-tv{flex-direction:column;padding-bottom:0}
.tv-top{display:flex;align-items:flex-end;border-bottom:1px solid var(--line);flex-shrink:0}
#ch-groups{flex:1;white-space:nowrap;overflow-x:auto;overflow-y:hidden}
#ch-groups button{height:56px;margin-right:28px;color:var(--muted);position:relative;font-size:var(--t-ui)}
#ch-groups button.on{color:var(--fg)}
#ch-groups button.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent)}
.tv-top .r{display:flex;align-items:center;height:56px;color:var(--muted)}
.tv-top .r button{width:52px;height:52px;color:var(--muted)}
#ch-list{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;margin:0 -36px;padding:0 36px 22px}
.ch{width:50%;height:72px;display:flex;align-items:center;border-bottom:1px solid var(--line);padding-right:18px;text-align:left}
.ch:nth-child(even){padding-left:18px;padding-right:0;border-left:1px solid var(--line)}
.ch:active{background:var(--bg2)}
.ch .mono{width:44px;color:var(--muted);flex-shrink:0}
.ch-logo{width:48px;height:32px;flex-shrink:0;margin-right:14px;display:flex;align-items:center;justify-content:center}
.ch-logo img{max-width:100%;max-height:100%}
.ch .n{font:600 var(--t-row)/1.2 var(--sans);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* player */
#player{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:200}
#player video{width:100%;height:100%;object-fit:contain}
video::-internal-media-controls-overlay-cast-button{display:none}
#pl-close,#pl-bar{transition:opacity .4s var(--ease)}
#player.calm #pl-close,#player.calm #pl-bar{opacity:0;pointer-events:none}
#pl-close{position:absolute;top:12px;right:12px;height:56px;padding:0 20px;background:rgba(14,14,12,.78);border-radius:4px;color:var(--fg)}
#pl-close svg.i{margin-right:8px}
#pl-bar{position:absolute;left:0;right:0;bottom:0;padding:40px 24px 18px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.72))}
#pl-name{font-size:var(--t-val);letter-spacing:-.03em}
#pl-state{position:absolute;top:50%;left:0;right:0;text-align:center;margin-top:-10px;color:var(--muted)}

/* ambient: screensaver + sleep */
#amb{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:300;opacity:0;transition:opacity .8s var(--ease)}
#amb.on{opacity:1}
#amb-in{position:absolute;left:60px;top:28px;transition:transform 2s var(--ease)}
#amb .big{font-size:230px}
#amb .mono{margin-top:18px}
#amb.night .solid{color:#5a574f}
#amb.night .outline{-webkit-text-stroke-color:#5a574f}
#amb.night .mono{color:#4a473f}

/* preferences */
#prefs{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:350;padding:22px 36px 34px;display:flex;flex-direction:column}
.pf-head{display:flex;justify-content:space-between;align-items:center;height:56px;margin-bottom:6px}
#pf-close{height:56px;padding:0 4px 0 16px;color:var(--fg)}
#pf-close svg.i{margin-right:8px}
.pf-sec{margin:0 0 10px}
.pf-foot{margin-top:auto;text-align:right}
.pf-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.pf-sw{display:flex}
.pf-sw button{width:96px;height:48px;border:1px solid var(--line);font:600 var(--t-ui)/1 var(--sans);letter-spacing:-.01em}
.pf-sw button:first-child{border-radius:4px 0 0 4px}.pf-sw button:last-child{border-radius:0 4px 4px 0;margin-left:-1px}
.pf-sw button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);position:relative}
.pf-bright{display:grid;grid-template-columns:repeat(6,1fr);grid-gap:8px;margin-bottom:20px}
.pf-bright button{height:52px;border:1px solid var(--line);border-radius:4px;font:600 var(--t-ui)/1 var(--sans);letter-spacing:-.01em}
.pf-bright button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.pf-bright button:active{background:var(--bg2)}
.pf-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:56px;grid-gap:8px}
.acc-opt{border:1px solid var(--line);border-radius:4px;display:block;text-align:left;background-repeat:no-repeat;background-position:14px 50%;background-size:26px 26px;padding:0 10px 0 52px;position:relative}
.acc-opt b{display:block;font:600 var(--t-ui)/1.1 var(--sans);letter-spacing:-.01em;white-space:nowrap}
.acc-opt.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.acc-opt:active{background:var(--bg2)}

/* alert (alarm / timer end) */
#alert{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--accent);color:var(--accent-ink);z-index:400;padding:36px 56px;display:flex;flex-direction:column;justify-content:space-between}
#alert .big{font-size:200px;color:var(--accent-ink)}
#alert .outline{color:var(--accent);-webkit-text-stroke:4px var(--accent-ink)}
#alert .outline:after{color:var(--accent)}
#alert .mono{color:var(--accent-ink)}
/* ringing: the screen beats with the beeps (two beats every 1.4 s), waves pulse out from the digits */
#alert{overflow:hidden}
#alert>*{position:relative;z-index:1}
#alert:before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;opacity:0;z-index:0}
#alert .al-wave{position:absolute;z-index:0;left:120px;top:50%;width:240px;height:240px;margin-top:-120px;border:8px solid var(--accent-ink);border-radius:50%;opacity:0}
#alert .al-digits{-webkit-transform-origin:0 50%;transform-origin:0 50%}
#alert.ringing:before{animation:al-flash 1.4s ease-out infinite}
#alert.ringing .al-wave{animation:al-wave 1.4s cubic-bezier(.16,1,.3,1) infinite}
#alert.ringing .al-wave.w2{animation-delay:.45s}
#alert.ringing .al-digits{animation:al-thump 1.4s cubic-bezier(.16,1,.3,1) infinite}
#alert.ringing .al-tap{animation:al-blink 1.4s steps(1) infinite}
@keyframes al-flash{0%{opacity:.22}12%{opacity:0}32%{opacity:.22}44%{opacity:0}100%{opacity:0}}
@keyframes al-wave{0%{-webkit-transform:scale(.6);transform:scale(.6);opacity:.55}60%{opacity:0}100%{-webkit-transform:scale(3.6);transform:scale(3.6);opacity:0}}
@keyframes al-thump{0%{-webkit-transform:scale(1.07);transform:scale(1.07)}14%{-webkit-transform:scale(1);transform:scale(1)}32%{-webkit-transform:scale(1.07);transform:scale(1.07)}46%{-webkit-transform:scale(1);transform:scale(1)}}
@keyframes al-blink{0%{opacity:1}50%{opacity:.35}}
#alert .al-foot{display:flex;justify-content:space-between;align-items:baseline}
#alert .al-silent{background:var(--accent-ink);color:var(--accent);padding:6px 12px;border-radius:4px}
</style>
</head>

<script>
var $=function(id){return document.getElementById(id)};
// contorno: traço grosso por baixo, texto da cor do fundo por cima (esconde contornos sobrepostos da fonte)
document.querySelectorAll('.outline').forEach(watchOutline);
function watchOutline(el){var s=function(){el.setAttribute('data-t',el.textContent)};s();new MutationObserver(s).observe(el,{childList:true,characterData:true,subtree:true})}
function f2(n){return String(n).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmtN(n){return n.toLocaleString('en-GB')}
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function hm(s){var p=s.split(':');return +p[0]*60+ +p[1]}
function mins(d){return d.getHours()*60+d.getMinutes()}

// ---------- accent colour (escolhido no relógio, guardado localmente) ----------
var ACCENTS=[['Warm red','#e8473a'],['Signal red','#ef3b33'],['Cyan','#22c3e6'],['Amber','#f5b83d'],['Lime','#c8f04b'],['Cobalt','#5b7cff'],['Violet','#9b7bff'],['Pink','#ff6b9a']];
var ACCENT_CLASH={'#22c3e6':'#5fd0c4','#f5b83d':'#f2c14e','#5b7cff':'#8fb3ff','#9b7bff':'#b48cf2','#ff6b9a':'#f28fb3'};
var accent='#e8473a';try{accent=localStorage.getItem('accent')||accent}catch(e){}
if(!ACCENTS.some(function(a){return a[1]===accent}))accent='#e8473a'; // a removed accent falls back to the default
document.documentElement.style.setProperty('--accent',accent);
var BRIGHT=[10,25,40,60,80,100];
function brightPct(){var v=cfg.brightDay,best=BRIGHT[0];BRIGHT.forEach(function(p){if(Math.abs(p*2.55-v)<Math.abs(best*2.55-v))best=p});return best}
function setBright(p){cfg.brightDay=Math.max(3,Math.round(p*2.55));try{localStorage.setItem('brightDay',String(cfg.brightDay))}catch(e){}bright(cfg.brightDay);renderPrefs()}
function renderPrefs(){
  var cur=brightPct();$('pf-bright').innerHTML=BRIGHT.map(function(p){return '<button data-p="'+p+'"'+(p===cur?' class="on"':'')+'>'+p+'%</button>'}).join('');
  $('pf-grid').innerHTML=ACCENTS.map(function(a){return '<button class="acc-opt'+(a[1]===accent?' on':'')+'" data-c="'+a[1]+'" style="background-image:linear-gradient('+a[1]+','+a[1]+')"><b>'+a[0]+'</b></button>'}).join('');
}
function setAccent(c){
  accent=c;document.documentElement.style.setProperty('--accent',c);try{localStorage.setItem('accent',c)}catch(e){}
  clientMap={};renderPrefs();if(events)renderCal();
}
$('net').addEventListener('click',function(){renderPrefs();$('prefs').hidden=false});
$('pf-close').addEventListener('click',function(){$('prefs').hidden=true});
$('pf-bright').addEventListener('click',function(ev){var b=ev.target.closest('button');if(b)setBright(+b.getAttribute('data-p'))});
// mute during meetings: alarm/timer beeps stay silent and TV plays muted while a meeting is on
var muteMtg=false;try{muteMtg=localStorage.getItem('muteMeetings')==='1'}catch(e){}
function inMeeting(){if(!events)return false;var n=new Date();return events.some(function(e){return !e.all&&e.s<=n&&e.e>n})}
function quiet(){return muteMtg&&inMeeting()}
var tvMutedByUs=false;
function applyMute(){var v=$('vid'),q=quiet();if(q&&!v.muted){v.muted=true;tvMutedByUs=true}else if(!q&&tvMutedByUs){v.muted=false;tvMutedByUs=false}}
function renderMute(){[].forEach.call($('pf-mute').children,function(b){b.classList.toggle('on',(b.getAttribute('data-v')==='1')===muteMtg)})}
$('pf-mute').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;muteMtg=b.getAttribute('data-v')==='1';try{localStorage.setItem('muteMeetings',muteMtg?'1':'0')}catch(e){}renderMute();applyMute();renderNext()});
renderMute();
$('pf-grid').addEventListener('click',function(ev){var b=ev.target.closest('.acc-opt');if(b)setAccent(b.getAttribute('data-c'))});

// ---------- config (só no relógio) ----------
var cfg={sleepStart:'00:00',sleepEnd:'00:00',brightDay:160,brightNight:4,dayEndMinute:1035};
var cfgReady=fetch('config.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():{}}).catch(function(){return {}}).then(function(c){
  for(var k in c)cfg[k]=c[k];
});

// ---------- brilho (servidor local corre como root) ----------
var lastBright=-1,brightQ=Promise.resolve();
function bright(v){
  if(v===lastBright)return;lastBright=v;
  brightQ=brightQ.then(function(){return fetch('bright?v='+v,{cache:'no-store'})}).catch(function(){lastBright=-1});
}

// ---------- nav ----------
var cur='home';
function go(v){
  cur=v;
  document.querySelectorAll('.view').forEach(function(el){el.hidden=el.id!=='v-'+v});
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===v)});
  navBar();
  var view=$('v-'+v);view.classList.remove('enter');void view.offsetWidth;view.classList.add('enter');
  if(v==='tv'&&!channels.length)loadM3U();
  // calendar opens at "now": drop finished meetings, back to the top
  if(v==='home')setTimeout(marquee,50);
  if(v!=='cal')calMarqueeStop();
  if(v==='cal'&&events){renderCal();calToNow()}
}
function navBar(){var b=document.querySelector('nav button.on'),bar=$('nav-bar');if(!b)return;bar.style.width=(b.offsetWidth-28)+'px';bar.style.transform='translateX('+(b.offsetLeft+14)+'px)'}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){navBar();if(typeof marquee==='function')marquee()});setTimeout(navBar,300);
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-v'))})});

// ---------- clock ----------
function fitDate(now){
  var hd=$('h-date'),full=DAYS[now.getDay()].slice(0,3)+' · '+now.getDate()+' '+MONTHS[now.getMonth()]+' '+now.getFullYear();
  if(hd.textContent!==full)hd.textContent=full;
  // short month only when the date and the timer/alarm don't fit side by side
  var side=hd.nextElementSibling,room=hd.parentNode.clientWidth-(side&&side.offsetWidth?side.offsetWidth+16:0);
  if(room>0&&hd.scrollWidth>room)hd.textContent=full.replace(MONTHS[now.getMonth()],MONTHS[now.getMonth()].slice(0,3));
}
var lastMin=-1;
function tick(){
  var now=new Date(),h=f2(now.getHours()),m=f2(now.getMinutes());
  $('h-h').textContent=h;$('a-h').textContent=h;$('h-s').textContent=f2(now.getSeconds());
  $('a-m').textContent=m;
  applyMute();$('h-muted').hidden=!quiet();fitDate(now);
  if(now.getMinutes()!==lastMin){
    setMinute(m,lastMin!==-1);
    lastMin=now.getMinutes();
    drift();renderNext();renderHomeAlarm();checkAlarms(now);checkSleep(now);
  }
}

function setMinute(m,animate){
  var box=$('h-m'),olds=box.querySelectorAll('.r'),old=olds[olds.length-1];
  if(old&&old.textContent===m)return;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!animate||!old||reduce){box.innerHTML='<span class="r outline" data-t="'+m+'">'+m+'</span>';return}
  for(var i=0;i<olds.length-1;i++)olds[i].remove();
  var n=document.createElement('span');n.className='r outline in';n.textContent=m;n.setAttribute('data-t',m);
  n.style.transform='translateY(110%)';box.appendChild(n);void n.offsetWidth;
  var t='transform .7s cubic-bezier(.16,1,.3,1)';old.style.transition=t;n.style.transition=t;
  old.style.transform='translateY(-110%)';n.style.transform='translateY(0)';
  setTimeout(function(){if(old.parentNode)old.remove();n.classList.remove('in');n.style.transition='';n.style.transform=''},750);
}

// ---------- agenda (events.json do servidor local, quando existir) ----------
var events=null,evTried=false,wloc={};
setInterval(function(){if(cur==='cal'&&events){var cl=$('cal-list'),y=cl.scrollTop;renderCal();cl.scrollTop=y}},60000);
function loadEvents(){
  fetch(cfg.calendarUrl||'events.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).catch(function(){return null}).then(function(list){
    evTried=true;
    if(!Array.isArray(list)){$('ce-b').textContent='offline';$('ce-b').setAttribute('data-t','offline');$('ce-c').textContent='Could not reach Google Calendar. Trying again in 5 minutes.'}
    if(Array.isArray(list)){
      // working location (Home / Office) is not a meeting: keep it per day for the headings
      wloc={};
      events=list.filter(function(e){
        if(e.type!=='WORKING_LOCATION')return true;
        var d=new Date(e.start),k=d.getFullYear()+'-'+f2(d.getMonth()+1)+'-'+f2(d.getDate());
        wloc[k]=e.title||'';return false;
      }).map(function(e){return {s:new Date(e.start),e:new Date(e.end),t:e.title||'(no title)',all:!!e.allDay}}).sort(function(a,b){return a.s-b.s});
    } // else keep the last good list if a fetch fails
    renderCal();renderNext();
  });
}
var CLIENT_COLORS_ALL=['#8fb3ff','#f2c14e','#b48cf2','#5fd0c4','#f28fb3','#c9d36a'];
function clientColors(){return CLIENT_COLORS_ALL.filter(function(c){return c!==ACCENT_CLASH[accent]})}
var clientMap={};
// clients with their own brand colour come from config.json: {"brandColors":{"clientname":"#hex"}} (key: lowercase, letters/digits only)
function clientDot(t){
  var m=String(t).match(/^\[([^\]]+)\]/);if(!m)return '<i class="cl none"></i>';
  var k=m[1].toLowerCase().replace(/[^a-z0-9]/g,'');
  var BRAND=cfg.brandColors||{};if(BRAND[k])clientMap[k]=BRAND[k];
  if(!clientMap[k]){var h=0;for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;
    var used={};for(var c in clientMap)used[clientMap[c]]=1;
    for(var j=0;j<clientColors().length;j++){var col=clientColors()[(h+j)%clientColors().length];if(!used[col]){clientMap[k]=col;break}}
    if(!clientMap[k])clientMap[k]=clientColors()[h%clientColors().length]}
  return '<i class="cl" style="background:'+clientMap[k]+'"></i>';
}
function hhmm(d){return f2(d.getHours())+':'+f2(d.getMinutes())}
function nextEvent(){
  if(!events)return null;var now=new Date();
  for(var i=0;i<events.length;i++){var e=events[i];if(!e.all&&e.e>now)return e}
  return null;
}
function setL(l,h){if(l._h!==h){l._h=h;l.innerHTML=h}} // rewrite only on change, so the live dot keeps animating
// Home meeting block: swipe left/right (or tap) to browse today's later meetings; snaps back after 10 s
var nOff=0,nBack=null;
function todayLeft(){
  if(!events)return [];var now=new Date();
  return events.filter(function(e){return !e.all&&e.e>now&&e.s.toDateString()===now.toDateString()});
}
// long meeting titles on Home glide left to reveal the end, pause, glide back (instead of "…")
var mqAnim=null;
function marquee(){
  if(mqAnim){mqAnim.cancel();mqAnim=null}
  var sm=$('h-next').querySelector('small'),sp=sm&&sm.firstChild;if(!sp||!sp.animate)return;
  sm.classList.remove('mq-on');
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var d=sp.offsetWidth-sm.clientWidth;if(d<4)return;
  sm.classList.add('mq-on');
  var run=d/45*1000,hold=2500,T=hold*2+run*2,x='translateX(-'+(d+30)+'px)';
  mqAnim=sp.animate([
    {transform:'translateX(0)',offset:0},{transform:'translateX(0)',offset:hold/T,easing:'ease-in-out'},
    {transform:x,offset:(hold+run)/T},{transform:x,offset:(hold*2+run)/T,easing:'ease-in-out'},
    {transform:'translateX(0)',offset:1}],{duration:T,iterations:Infinity});
}
function renderNext(){
  var v=$('h-next'),l=$('h-next-l'),blk=$('h-next-blk');
  v.classList.toggle('dim',!events);
  blk.classList.remove('hot');blk.classList.remove('live');blk.classList.remove('browse');
  v.classList.toggle('loading',!events&&!evTried);

  // free time: gaps of 15+ min inside the working day (weekdays 09:00–17:00)
  var WS=9*60,WE=17*60,MINGAP=15;

  function freeNow(f0,t){var n0=new Date(now);n0.setSeconds(0,0);var left=Math.round((t-n0)/60000),p=Math.max(0,Math.min(1,(t-now)/(t-f0)));

    var wd=a.getDay()>0&&a.getDay()<6;

    var nm=new Date(now);nm.setSeconds(0,0);var cur=nm>ws?nm:ws,out='',freeMin=0,n=0;

    var g=((lines[i].match(/group-title="([^"]*)"/)||[])[1]||'').trim();if(!g||/^(n\/a|undefined|none|null)$/i.test(g))g='Other';
    var url=lines[i+1]||'';
    if(url&&url[0]!=='#'){channels.push({n:n++,name:name,url:url,logo:logo,g:g});if(groups.indexOf(g)<0)groups.push(g)}
  }
  var oi=groups.indexOf('Other');if(oi>=0&&oi<groups.length-1){groups.splice(oi,1);groups.push('Other')}
  if(groups.indexOf(curGroup)<0)curGroup=groups[0]||null;
  $('tv-status').textContent=channels.length+' channels';renderG();renderCh();
}
function renderG(){$('ch-groups').innerHTML=groups.map(function(g,i){return '<button data-g="'+i+'"'+(g===curGroup?' class="on"':'')+'>'+esc(g)+'</button>'}).join('')}
$('ch-groups').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;curGroup=groups[+b.getAttribute('data-g')];renderG();renderCh();$('ch-list').scrollTop=0});
function renderCh(){
  $('ch-list').innerHTML=channels.map(function(c,i){return c.g!==curGroup?'':'<button class="ch" data-i="'+i+'"><span class="mono">'+c.n+'</span><span class="ch-logo">'+(c.logo?'<img src="'+esc(c.logo)+'" alt="" onerror="this.remove()">':'')+'</span><span class="n">'+esc(c.name)+'</span></button>'}).join('');
}
$('ch-list').addEventListener('click',function(ev){var b=ev.target.closest('.ch');if(b)play(+b.getAttribute('data-i'))});
$('tv-reload').addEventListener('click',loadM3U);
function play(i){
  var c=channels[i];if(!c)return;var vid=$('vid');
  $('pl-name').textContent=c.name;$('pl-state').textContent='Connecting';$('player').hidden=false;
  if(hls){hls.destroy();hls=null}
  $('player').classList.remove('calm');
  vid.onplaying=function(){$('pl-state').textContent='';calmSoon()};
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true});hls.loadSource(c.url);hls.attachMedia(vid);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){vid.play().catch(function(){})});
    hls.on(Hls.Events.ERROR,function(e,d){if(d.fatal)$('pl-state').textContent='No signal — close and try another channel'});
  }else{vid.src=c.url;vid.play().catch(function(){})}
}
var calmT=null;
function calmSoon(){clearTimeout(calmT);calmT=setTimeout(function(){$('player').classList.add('calm')},4000)}
$('player').addEventListener('click',function(ev){if(ev.target.closest('#pl-close'))return;$('player').classList.remove('calm');calmSoon()});
$('pl-close').addEventListener('click',function(){clearTimeout(calmT);var v=$('vid');v.pause();v.removeAttribute('src');v.load();if(hls){hls.destroy();hls=null}$('player').hidden=true;resetIdle()});

// ---------- arranque ----------
setTimer(25*60);
cfgReady.then(function(){
  try{var sb=+localStorage.getItem('brightDay');if(sb)cfg.brightDay=sb}catch(e){}
  tick();setInterval(tick,1000);
  fetchSteps();setInterval(fetchSteps,60*1000);
  loadEvents();setInterval(loadEvents,5*60*1000);
  lastTouch=0;checkSleep(new Date());resetIdle();if(!sleeping)bright(cfg.brightDay);
  setInterval(function(){checkSleep(new Date())},5000);
  var h=location.hash.slice(1);if($('v-'+h))go(h);
});
</script>
